# =============================================================================
# Production: сборка приложения (Dockerfile) + nginx на порту 3000.
# Запуск: npm run docker-compose
# Остановка: npm run docker-down
# Остановка и удаление образов/томов: npm run docker-clean
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: ${VITE_APP_NAME}
    image: ${VITE_APP_NAME}
    container_name: ${VITE_APP_NAME}-app
    ports:
      - "3003:80"
    restart: unless-stopped
