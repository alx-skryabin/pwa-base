# Запускается после успешного прохождения CI (Lint & Prettier) на master.
# Увеличивает версию в package.json, создаёт коммит "release: X.Y.Z [skip ci]", теги vX.Y.Z и release, пушит обратно.
name: Release version bump

on:
  workflow_run:
    workflows: ["Lint & Prettier"]
    types: [completed]
    branches: [master]

jobs:
  bump:
    runs-on: ubuntu-latest
    # Только если CI завершился успехом (не failed/cancelled)
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
          fetch-depth: 0

      - name: Check if last commit is already a release
        id: check_skip
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -q '^release: '; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_skip.outputs.skip != 'true'
        run: npm ci

      - name: Bump version (patch)
        if: steps.check_skip.outputs.skip != 'true'
        run: npm version patch --no-git-tag-version
        env:
          npm_config_commit_hooks: false

      - name: Get new version
        if: steps.check_skip.outputs.skip != 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit and tag
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json package-lock.json
          V="${{ steps.version.outputs.version }}"
          git commit -m "release: $V"
          git tag -a "v$V" -m "release: $V"
          git tag -f release
          git push origin HEAD:master
          git push origin "v$V"
          git push origin release --force
