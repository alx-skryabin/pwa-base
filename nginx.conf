# =============================================================================
# Nginx для production-контейнера. Раздаёт статику из /usr/share/nginx/html
# (собранный Vite build). Используется только в prod-режиме (Dockerfile).
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие ответов для уменьшения размера JS/CSS.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;

    # SPA: несуществующие пути отдаём как index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгий кэш для статики с хешем в имени (JS, CSS, шрифты, картинки).
    location ~* \.(js|css|woff2?|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker и manifest — короткий/без кэша, чтобы PWA получала обновления.
    location ~* (sw\.js|workbox-.*\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache";
        try_files $uri =404;
    }

    # Заголовки безопасности.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
